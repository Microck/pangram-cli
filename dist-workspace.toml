[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = []
installers = []
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
checksum = "sha256"
auto-includes = false
unix-archive = ".tar.xz"
windows-archive = ".zip"
include = ["README.md", "LICENSE", "assets/brand/NOTICE.md"]
install-updater = false
pr-run-mode = "plan"
github-attestations = true
