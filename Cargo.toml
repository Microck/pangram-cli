[package]
name = "microck-pangram-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Unofficial Pangram terminal client"
license = "MIT"
repository = "https://github.com/Microck/pangram-cli"
publish = false
default-run = "pangram"

[features]
default = []
dev-tools = []

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
directories = "=6.0.0"
jiff = { version = "=0.2.35", features = ["serde"] }
# rustls-only TLS through the platform verifier; native TLS is never
# compiled. `system-proxy` keeps the documented system proxy discovery,
# `charset` and `http2` match the documented HTTP profile. Verified against
# the reqwest 0.13.4 manifest (evidence-ledger).
reqwest = { version = "=0.13.4", default-features = false, features = [
    "rustls",
    "system-proxy",
    "http2",
    "charset",
    "json",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
rpassword = "=7.5.4"
# Local history storage (architecture-spec 11.1): bundled SQLite with FTS5.
# `default-features = false` keeps rusqlite's `cache` (hashlink) default out
# of the shipped graph (rusqlite 0.39.0 has no other default feature).
# `bundled` compiles vendored SQLite 3.51.3 through the transitive
# libsqlite3-sys 0.37.0, whose build script unconditionally defines
# SQLITE_ENABLE_FTS5 (evidence-ledger). No async database abstraction;
# adapters use spawn_blocking when needed.
# Pin note: rusqlite 0.40.1/0.38.1 effectively require Rust 1.95
# (`cfg_select!`, stabilized in 1.95, is used in rusqlite source and in the
# libsqlite3-sys 0.38.1 build script), which exceeds the locked package MSRV
# of 1.87. rusqlite 0.39.0 requires `libsqlite3-sys ^0.37.0`; under Cargo's
# 0.x caret semantics ^0.37.0 resolves only to >=0.37.0, <0.38.0, so the
# incompatible 0.38.1 can never be selected, and Cargo.lock pins the
# transitive 0.37.0 on top of that. No direct libsqlite3-sys dependency is
# needed: this is the newest pair that compiles on Rust 1.87.0.
rusqlite = { version = "=0.39.0", default-features = false, features = [
    "bundled",
] }
schemars = { version = "=1.2.2", features = ["jiff02", "preserve_order", "uuid1"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
# SIGINT-only interruption of CLI observation waits. Low-level and
# platform-portable; `iterator` drives the blocking signal loop on one
# dedicated thread so no signal handler touches application state.
signal-hook = "=0.4.4"
thiserror = "=2.0.19"
# Canonical TOON projection of the JSON envelope. `default-features = false`
# keeps the heavy `cli` feature out of the shipped binary; the projection uses
# only `toon_format::encode_default`. Requires Rust 1.87 (`unsigned_is_multiple_of`
# in the decoder), which is the package rust-version. Evidence: evidence-ledger.
toon-format = { version = "=0.5.0", default-features = false }
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
toml = "=1.0.7"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
zeroize = "=1.8.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "json",
] }
jsonschema = { version = "=0.49.2", default-features = false }
proptest = "=1.11.0"
tempfile = "=3.27.0"
# Paused-time deterministic protocol tests. `test-util` stays out of every
# shipped build; it is additive for the dev target only.
tokio = { version = "=1.53.1", features = ["test-util"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[[bin]]
name = "pangram"
path = "src/main.rs"

[[bin]]
name = "generate-contracts"
path = "tools/generate-contracts.rs"
required-features = ["dev-tools"]

# The Pangram protocol fixture reaches loopback-only client constructors and
# does not ship in release artifacts.
[[test]]
name = "analysis-protocol"
path = "tests/analysis-protocol.rs"
required-features = ["dev-tools"]

# Compiled-binary detect integration against the loopback fixture.
[[test]]
name = "detect-cli-loopback"
path = "tests/detect-cli-loopback.rs"
required-features = ["dev-tools"]

# Compiled-binary bulk submit integration against the loopback fixture.
[[test]]
name = "bulk-task-cli-loopback"
path = "tests/bulk-task-cli-loopback.rs"
required-features = ["dev-tools"]

# Compiled-binary bulk status/wait/results and task status/wait integration.
[[test]]
name = "bulk-task-status-results-loopback"
path = "tests/bulk-task-status-results-loopback.rs"
required-features = ["dev-tools"]

# Compiled-binary task status/wait integration split from the bulk suite so
# both targets remain below the source-size threshold.
[[test]]
name = "task-status-wait-loopback"
path = "tests/task-status-wait-loopback.rs"
required-features = ["dev-tools"]

# Phase 4 Packet C: compiled-binary history save integration against the
# loopback fixture and a real SQLite store in a temporary data directory.
[[test]]
name = "history-save-detect-loopback"
path = "tests/history-save-detect-loopback.rs"
required-features = ["dev-tools"]

# Phase 4 Packet C remediation: the deterministic mixed-outcome proof (one
# member's real SQLite insert fails; the later member still persists in order).
[[test]]
name = "history-save-mixed-outcome-loopback"
path = "tests/history-save-mixed-outcome-loopback.rs"
required-features = ["dev-tools"]

# Phase 4 Packet C: the reconciliation semantics suite split out of the
# failure suite so each stays under the source-size threshold.
[[test]]
name = "history-save-reconciliation-loopback"
path = "tests/history-save-reconciliation-loopback.rs"
required-features = ["dev-tools"]

# Phase 4 Packet C remediation: order-independent task/bulk reconciliation
# through the compiled binary, split out of the reconciliation suite so each
# stays under the source-size threshold.
[[test]]
name = "history-save-order-loopback"
path = "tests/history-save-order-loopback.rs"
required-features = ["dev-tools"]

# The golden regenerator is a maintenance tool only; the normal suite reads
# the committed fixtures directly under strict `-D warnings`.
[[test]]
name = "projection-contract-golden"
path = "tests/projection-contract-golden.rs"
required-features = ["dev-tools"]

# Phase 4 Packet C remediation: ambiguous taskless-membership reconciliation
# split from the order suite so both remain below the source-size threshold.
[[test]]
name = "history-store-reconcile-ambiguity"
path = "tests/history-store-reconcile-ambiguity.rs"

# Rust-owned schema assertions split from the general domain contract suite so
# both remain below the source-size threshold.
[[test]]
name = "domain-schema-contract"
path = "tests/domain-schema-contract.rs"

[profile.release]
panic = "unwind"
