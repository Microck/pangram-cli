[package]
name = "microck-pangram-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Pangram terminal client"
license = "MIT"
repository = "https://github.com/Microck/pangram-cli"
publish = false
default-run = "pangram"

[features]
default = []
dev-tools = []

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
directories = "=6.0.0"
jiff = { version = "=0.2.35", features = ["serde"] }
rpassword = "=7.5.4"
schemars = { version = "=1.2.2", features = ["jiff02", "preserve_order", "uuid1"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
toml = "=1.0.7"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
zeroize = "=1.8.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
proptest = "=1.11.0"
tempfile = "=3.27.0"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[[bin]]
name = "pangram"
path = "src/main.rs"

[[bin]]
name = "generate-contracts"
path = "tools/generate-contracts.rs"
required-features = ["dev-tools"]

[profile.release]
panic = "unwind"
