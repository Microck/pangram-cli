[package]
name = "microck-pangram-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Pangram terminal client"
license = "MIT"
repository = "https://github.com/Microck/pangram-cli"
publish = false
default-run = "pangram"

[features]
default = []
dev-tools = []

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
jiff = { version = "=0.2.35", features = ["serde"] }
schemars = { version = "=1.2.2", features = ["jiff02", "preserve_order", "uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
proptest = "=1.11.0"
tempfile = "=3.27.0"

[[bin]]
name = "pangram"
path = "src/main.rs"

[[bin]]
name = "generate-contracts"
path = "tools/generate-contracts.rs"
required-features = ["dev-tools"]

[profile.release]
panic = "unwind"
