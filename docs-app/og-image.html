<!doctype html>
<!-- Regenerate from the repository root:
chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --force-device-scale-factor=1 --screenshot=$PWD/docs-app/public/landing/images/og-image.png file://$PWD/docs-app/og-image.html
magick docs-app/public/landing/images/og-image.png -strip -sampling-factor 4:4:4 -quality 88 docs-app/public/landing/images/og-image.jpg
rm docs-app/public/landing/images/og-image.png
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      @font-face { font-family: Eiko; src: url('./public/landing/fonts/ppeiko-thin.woff2'); font-weight: 100; }
      @font-face { font-family: Plex; src: url('./public/landing/fonts/IBMPlexSans-Medium.woff2'); font-weight: 500; }
      @font-face { font-family: Mono; src: url('./public/landing/fonts/IBMPlexMono-Regular.woff2'); }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { display: grid; grid-template-columns: 53% 47%; color: #14201e; background: #f8f7f6; }
      .copy { position: relative; z-index: 2; display: flex; flex-direction: column; padding: 54px 62px 48px; }
      .brand { display: flex; align-items: center; gap: 14px; font: 500 31px/1 Plex, sans-serif; letter-spacing: -.04em; }
      .brand em { color: #ff6106; font-style: normal; }
      .badge { padding: 6px 9px 5px; border: 1px solid #14201e; font: 500 10px/1 Plex, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 72px 0 0; font: 100 82px/.89 Eiko, Georgia, serif; letter-spacing: -.045em; }
      h1 span { position: relative; white-space: nowrap; }
      h1 span::after { position: absolute; right: 0; bottom: 3px; left: 0; z-index: -1; height: 10px; background: #ff6106; content: ''; }
      .sub { max-width: 460px; margin: 25px 0 0; font: 500 18px/1.48 Plex, sans-serif; }
      .command { margin-top: auto; padding: 17px 20px; border: 1px solid #14201e; background: #f8f7f6; font: 13px/1 Mono, monospace; box-shadow: 7px 7px 0 #ff6106; }
      .command b { margin-right: 11px; color: #ff6106; }
      .visual { position: relative; overflow: hidden; background: #14201e; }
      .visual::before { position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(20,32,30,.13), transparent 38%); content: ''; }
      .visual img { width: 100%; height: 100%; object-fit: cover; object-position: 65% center; }
    </style>
  </head>
  <body>
    <main class="copy">
      <div class="brand">Pangram<em>/cli</em><span class="badge">unofficial</span></div>
      <h1>AI detection,<br><span>without leaving</span><br>your terminal.</h1>
      <p class="sub">A CLI, interactive TUI, and typed stdio MCP server for Pangram.</p>
      <div class="command"><b>$</b> curl -fsSL https://pangram.micr.dev/install | sh</div>
    </main>
    <aside class="visual">
      <img src="./public/landing/images/scene-01.webp" alt="">
    </aside>
  </body>
</html>
