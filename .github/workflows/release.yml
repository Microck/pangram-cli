name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from the merged Tegami version change
        required: true
        type: string
      publish:
        description: Create the authorized private draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Validate release plan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.32.0 --locked
      - name: Match the merged version and release policy
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_AUTHORIZED: ${{ vars.PANGRAM_PUBLIC_RELEASE_AUTHORIZED }}
          PANGRAM_PERMISSION_SHA256: ${{ vars.PANGRAM_PERMISSION_EVIDENCE_SHA256 }}
          INTRO_APPROVED: ${{ vars.PANGRAM_INTRO_APPROVED }}
          REGISTRIES_OWNED: ${{ vars.PANGRAM_REGISTRIES_OWNED }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as file:
              package_version = tomllib.load(file)["package"]["version"]
          requested = os.environ["REQUESTED_VERSION"]
          if package_version != requested:
              raise SystemExit(f"Cargo version {package_version} does not match {requested}")
          if os.environ["PUBLISH"] == "true":
              required = {
                  "PANGRAM_PUBLIC_RELEASE_AUTHORIZED": os.environ["RELEASE_AUTHORIZED"],
                  "PANGRAM_PERMISSION_EVIDENCE_SHA256": os.environ["PANGRAM_PERMISSION_SHA256"],
                  "PANGRAM_INTRO_APPROVED": os.environ["INTRO_APPROVED"],
                  "PANGRAM_REGISTRIES_OWNED": os.environ["REGISTRIES_OWNED"],
              }
              missing = [name for name, value in required.items() if not value or value != "true" and name != "PANGRAM_PERMISSION_EVIDENCE_SHA256"]
              if missing:
                  raise SystemExit(f"release authority gate is closed: {', '.join(missing)}")
          PY
          # cargo-dist owns version and target planning. The custom packager
          # owns archives because cargo-dist includes feature-gated developer
          # binaries from a single Cargo package in its default archive plan.
          dist plan --tag="v${REQUESTED_VERSION}"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            executable: pangram
            baseline_image: quay.io/pypa/manylinux2014_x86_64@sha256:edb6edbd84c2fa9d40ee83abb160e302ebce82eb93570d43343942a1fb10b962
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            executable: pangram
            baseline_image: quay.io/pypa/manylinux2014_aarch64@sha256:1145c233b5693c770b878d51e64261603b0d374942ff134d589656799f72e9f9
          - target: x86_64-apple-darwin
            os: macos-15-intel
            executable: pangram
          - target: aarch64-apple-darwin
            os: macos-15
            executable: pangram
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            executable: pangram.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Build and package the native release binary
        uses: ./.github/actions/build-release-archive
        with:
          target: ${{ matrix.target }}
          executable: ${{ matrix.executable }}
          baseline-image: ${{ matrix.baseline_image }}
      - name: Upload target archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error

  assemble:
    name: Sign and audit release artifacts
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: pangram-public-release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download target archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install cargo-about
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - name: Sign the exact update manifest
        env:
          SIGNING_KEY_BASE64: ${{ secrets.PANGRAM_UPDATE_SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ID: ${{ vars.PANGRAM_UPDATE_SIGNING_KEY_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_KEY_ID"
          key_file="$RUNNER_TEMP/update-signing-key"
          trap 'shred -u "$key_file" 2>/dev/null || rm -f "$key_file"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode >"$key_file"
          chmod 600 "$key_file"
          cargo run --locked --features dev-tools --bin sign-update-manifest -- \
            --artifacts-dir release-artifacts \
            --out-dir release-artifacts \
            --key-file "$key_file" \
            --key-id "$SIGNING_KEY_ID" \
            --version "$VERSION" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --minimum-updater-version "1.0.0"
          node scripts/render-package-manifests.mjs release-artifacts "$VERSION"
          rm release-artifacts/*.artifact.json
      - name: Pack staged npm and installer verification inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-verification/npm
          cp \
            release-artifacts/pangram-update-manifest.json \
            release-artifacts/pangram-update-manifest.json.sig \
            release-artifacts/pangram-installer.sh \
            release-artifacts/pangram-installer.ps1 \
            release-artifacts/pangram.rb \
            release-artifacts/pangram-scoop.json \
            scripts/smoke-homebrew-release.sh \
            scripts/smoke-scoop-release.ps1 \
            release-verification/
          node scripts/stage-npm-packages.mjs release-artifacts "$VERSION"
          npm run packages:check
          node scripts/pack-npm-release.mjs release-verification/npm "$VERSION"
      - name: Generate third-party license notices
        run: >-
          cargo about generate about.hbs
          --config about.toml
          --output-file release-artifacts/THIRD-PARTY-LICENSES.txt
      - name: Generate SPDX SBOMs
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/pangram-release.spdx.json
          upload-artifact: false
      - name: Bind every public asset to the checksum file
        run: >-
          cd release-artifacts &&
          sha256sum pangram-* pangram.rb THIRD-PARTY-LICENSES.txt >SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release-artifacts/*
      - name: Upload assembled private artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pangram-v${{ inputs.version }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Upload signed native-smoke inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pangram-release-verification
          path: release-verification/
          if-no-files-found: error

  smoke:
    name: Install ${{ matrix.target }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Check out pinned Scoop
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: .scoop
          persist-credentials: false
      - name: Download target archive
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts
      - name: Download signed verification inputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pangram-release-verification
          path: release-artifacts
      - name: Run the public signed installer and receipt-owned replacement smoke test
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sh -n release-artifacts/pangram-installer.sh
          root="$(mktemp -d)"
          real_curl="$(command -v curl)"
          server_origin=http://127.0.0.1:18765
          python3 -m http.server 18765 --bind 127.0.0.1 \
            --directory release-artifacts >"$root/http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; rm -rf "$root"' EXIT
          attempt=0
          until "$real_curl" --fail --silent \
            "$server_origin/pangram-update-manifest.json" --output /dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -eq 50 ]; then
              printf '%s\n' "local release server did not start" >&2
              exit 1
            fi
            sleep 0.1
          done

          # The generated installer keeps its fixed production URL. This
          # transport shim verifies that URL and redirects only its downloads
          # to the loopback server holding the exact signed workflow inputs.
          mkdir -p "$root/commands"
          cat >"$root/commands/curl" <<'SH'
          #!/bin/sh
          set -eu
          [ "$#" -eq 7 ] || exit 64
          [ "$1" = --fail ] && [ "$2" = --location ] &&
            [ "$3" = --silent ] && [ "$4" = --show-error ] &&
            [ "$6" = --output ] || exit 64
          case "$5" in
            "$PANGRAM_INSTALLER_SMOKE_RELEASE_URL"/*) ;;
            *) printf '%s\n' "unexpected installer URL: $5" >&2; exit 64 ;;
          esac
          asset=${5##*/}
          exec "$PANGRAM_INSTALLER_SMOKE_CURL" \
            --fail --location --silent --show-error \
            "$PANGRAM_INSTALLER_SMOKE_ORIGIN/$asset" --output "$7"
          SH
          chmod 755 "$root/commands/curl"
          export HOME="$root/home"
          export XDG_DATA_HOME="$root/data"
          export PANGRAM_INSTALLER_SMOKE_CURL="$real_curl"
          export PANGRAM_INSTALLER_SMOKE_ORIGIN="$server_origin"
          export PANGRAM_INSTALLER_SMOKE_RELEASE_URL="https://github.com/Microck/pangram-cli/releases/download/v${VERSION}"
          export PATH="$root/commands:$PATH"
          mkdir -p "$HOME"
          destination="$HOME/.local/bin/pangram"
          sh release-artifacts/pangram-installer.sh
          test "$("$destination" --version)" = "pangram ${VERSION}"
          test "$(find "$root" -name install-receipt.json -type f | wc -l | tr -d ' ')" = 1
          receipt="$(find "$root" -name install-receipt.json -type f)"
          cp "$receipt" "$root/initial-receipt.json"

          # A second run must enter the receipt-owned replacement path and
          # publish a new receipt only after the installed binary passes smoke.
          sleep 1
          sh release-artifacts/pangram-installer.sh
          test "$("$destination" --version)" = "pangram ${VERSION}"
          ! cmp -s "$root/initial-receipt.json" "$receipt"
          test "$(find "$root" -name '.install-receipt.json.pending' -type f | wc -l | tr -d ' ')" = 0
      - name: Run the public signed installer and receipt-owned replacement smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "release-artifacts/pangram-installer.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw $parseErrors[0] }
          $root = Join-Path $env:RUNNER_TEMP ("pangram-smoke-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root | Out-Null
          $receiptDirectory = Join-Path (
            [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          ) "micr\pangram\data"
          $receipt = Join-Path $receiptDirectory "install-receipt.json"
          $pendingReceipt = Join-Path $receiptDirectory ".install-receipt.json.pending"
          if ((Test-Path -LiteralPath $receipt) -or (Test-Path -LiteralPath $pendingReceipt)) {
            throw "ephemeral runner already has direct-install receipt state"
          }
          $server = $null
          try {
            $env:LOCALAPPDATA = Join-Path $root "local-app-data"
            $serverOrigin = "http://127.0.0.1:18765"
            $server = Start-Process -FilePath (Get-Command python).Source -ArgumentList @(
              "-m", "http.server", "18765", "--bind", "127.0.0.1",
              "--directory", (Resolve-Path "release-artifacts").Path
            ) -RedirectStandardOutput (Join-Path $root "http.stdout.log") `
              -RedirectStandardError (Join-Path $root "http.stderr.log") -PassThru
            $ready = $false
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              try {
                Microsoft.PowerShell.Utility\Invoke-WebRequest -UseBasicParsing `
                  -Uri "$serverOrigin/pangram-update-manifest.json" `
                  -OutFile (Join-Path $root "ready-manifest.json")
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if (-not $ready) { throw "local release server did not start" }

            # Keep the generated production URL intact while redirecting only
            # its downloads to the loopback server with the signed inputs.
            $env:PANGRAM_INSTALLER_SMOKE_ORIGIN = $serverOrigin
            $env:PANGRAM_INSTALLER_SMOKE_RELEASE_URL =
              "https://github.com/Microck/pangram-cli/releases/download/v$env:VERSION/"
            function Invoke-WebRequest {
              param(
                [switch]$UseBasicParsing,
                [Parameter(Mandatory = $true)][Uri]$Uri,
                [Parameter(Mandatory = $true)][string]$OutFile
              )
              if (-not $Uri.AbsoluteUri.StartsWith(
                $env:PANGRAM_INSTALLER_SMOKE_RELEASE_URL,
                [StringComparison]::Ordinal
              )) {
                throw "unexpected installer URL: $Uri"
              }
              $asset = [IO.Path]::GetFileName($Uri.AbsolutePath)
              Microsoft.PowerShell.Utility\Invoke-WebRequest -UseBasicParsing `
                -Uri "$env:PANGRAM_INSTALLER_SMOKE_ORIGIN/$asset" -OutFile $OutFile
            }

            $destination = Join-Path $env:LOCALAPPDATA "Programs\Pangram\bin\pangram.exe"
            & "release-artifacts/pangram-installer.ps1"
            if ((& $destination --version) -ne "pangram $env:VERSION") {
              throw "installed binary version mismatch"
            }
            if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) {
              throw "direct install receipt missing"
            }
            $initialReceipt = Get-Content -LiteralPath $receipt -Raw

            # Windows replacement finishes in a child process after this
            # candidate exits, so wait for its smoke-tested receipt publication.
            Start-Sleep -Seconds 1
            & "release-artifacts/pangram-installer.ps1"
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $replacementReceipt = Get-Content -LiteralPath $receipt -Raw
              if ($replacementReceipt -ne $initialReceipt) { break }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($replacementReceipt -eq $initialReceipt) {
              throw "receipt-owned replacement did not publish a new receipt"
            }
            if ((& $destination --version) -ne "pangram $env:VERSION") {
              throw "replacement binary version mismatch"
            }
            if (Test-Path -LiteralPath $pendingReceipt) {
              throw "replacement receipt was not finalized"
            }
          } finally {
            Remove-Item Function:\Invoke-WebRequest -Force -ErrorAction SilentlyContinue
            if ($null -ne $server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              $server.WaitForExit()
            }
            Remove-Item -LiteralPath $root -Recurse -Force
            Remove-Item -LiteralPath $receipt, $pendingReceipt -Force -ErrorAction SilentlyContinue
          }
      - name: Install the staged npm packages offline
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          export npm_config_cache="$root/npm-cache"
          packages="$GITHUB_WORKSPACE/release-artifacts/npm/packages.json"
          native_package="$(node -e 'const p=require(process.argv[1]); process.stdout.write(p.targets[process.env.TARGET] ?? "")' "$packages")"
          wrapper_package="$(node -e 'const p=require(process.argv[1]); process.stdout.write(p.wrapper)' "$packages")"
          test -n "$native_package"
          cd "$root"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --offline --omit=optional \
            "$GITHUB_WORKSPACE/release-artifacts/npm/$native_package" \
            "$GITHUB_WORKSPACE/release-artifacts/npm/$wrapper_package"
          test "$(node node_modules/@microck/pangram-cli/bin/pangram.js --version)" = \
            "pangram ${VERSION}"
      - name: Install and test the generated Homebrew formula
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash release-artifacts/smoke-homebrew-release.sh release-artifacts "$VERSION"
      - name: Install the generated Scoop manifest
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          & "release-artifacts/smoke-scoop-release.ps1"
          -Artifacts "release-artifacts"
          -ScoopSource ".scoop"
          -Version "$env:VERSION"

  publish-release:
    name: Create authorized private draft release
    if: inputs.publish
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download assembled release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pangram-v${{ inputs.version }}
          path: release-artifacts
      - name: Create authorized private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          with Path("Cargo.toml").open("rb") as file:
              package = tomllib.load(file)["package"]
          heading = f"## {package['name']}@{version}"
          changelog = Path("CHANGELOG.md")
          try:
              content = changelog.read_text(encoding="utf-8")
          except FileNotFoundError:
              raise SystemExit("Tegami package changelog is missing")
          start = content.find(f"{heading}\n")
          if start < 0:
              raise SystemExit(f"Tegami changelog section is missing: {heading}")
          end = content.find("\n## ", start + len(heading))
          notes = content[start:] if end < 0 else content[start:end]
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              notes.rstrip() + "\n",
              encoding="utf-8",
          )
          PY
          gh release create "v${VERSION}" release-artifacts/* \
            --draft --title "Pangram CLI v${VERSION}" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
