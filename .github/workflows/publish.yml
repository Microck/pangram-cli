name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public GitHub Release version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the authorized npm package set
    runs-on: ubuntu-24.04
    environment: pangram-public-release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: v${{ inputs.version }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Re-resolve platform packages published by an earlier attempt
        # The version commit records unpublished platform packages as
        # versionless placeholders. After any of them publish, npm ci rejects
        # those placeholders, so a retry re-resolves only the published ones
        # and keeps the rest (newer npm drops unresolvable entries entirely).
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const original = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const wanted = require("./npm/pangram-cli/package.json").optionalDependencies;
            const published = (name) => {
              try {
                return execFileSync("npm", ["view", `${name}@${wanted[name]}`, "version"], {
                  encoding: "utf8", stdio: ["ignore", "pipe", "ignore"],
                }).trim() === wanted[name];
              } catch { return false; }
            };
            const placeholders = Object.entries(original.packages).filter(([key, value]) =>
              /node_modules\/@microck\/pangram-cli-[^/]+$/.test(key) && !value.version);
            const stale = placeholders.filter(([key]) => published(key.split("node_modules/").pop()));
            if (stale.length === 0) { console.log("no published placeholders"); process.exit(0); }
            const lock = structuredClone(original);
            for (const [key] of stale) delete lock.packages[key];
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            execFileSync("npm", ["install", "--package-lock-only", "--ignore-scripts", "--no-audit", "--no-fund"], { stdio: "inherit" });
            const resolved = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const keep = placeholders.filter((entry) => !stale.includes(entry));
            for (const [key, value] of keep) resolved.packages[key] ??= value;
            fs.writeFileSync("package-lock.json", JSON.stringify(resolved, null, 2) + "\n");
            console.log(`re-resolved ${stale.length}, kept ${keep.length} unpublished placeholders`);
          '
      - name: Install exact development dependencies
        run: npm ci --ignore-scripts --workspaces=false
      - name: Require the exact public release and authorization
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_AUTHORIZED: ${{ vars.PANGRAM_PUBLIC_RELEASE_AUTHORIZED }}
        run: |
          test "$RELEASE_AUTHORIZED" = true
          node -e '
            const manifest = require("./npm/pangram-cli/package.json");
            if (manifest.version !== process.env.VERSION) {
              throw new Error("package and authorized release versions do not match");
            }
          '
          release="$(gh release view "v${VERSION}" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r .tagName <<<"$release")" = "v${VERSION}"
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = false
      - name: Download and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir release-artifacts
          gh release download "v${VERSION}" --dir release-artifacts
          (cd release-artifacts && sha256sum --check SHA256SUMS)
      - name: Stage exact native binaries into platform packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/stage-npm-packages.mjs release-artifacts "$VERSION"
          npm run packages:check
          "npm/pangram-cli-linux-x64/bin/pangram" --version | grep -Fx "pangram ${VERSION}"
      - name: Validate the Tegami publish lock
        run: npm run tegami -- publish --dry-run
      - name: Publish missing platform packages, then the main package
        run: npm run tegami -- publish
      - name: Publish any platform package still missing from the registry
        # Tegami runs the platform hook only while it publishes the main
        # package. If an earlier attempt published the main package but not
        # every platform package, this pass finishes the set on retry.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for directory in npm/pangram-cli-*/; do
            name="$(node -p "require('./${directory}package.json').name")"
            version="$(node -p "require('./${directory}package.json').version")"
            test "$version" = "$VERSION"
            published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              echo "present: ${name}@${version}"
              continue
            fi
            (cd "$directory" && npm publish --access public --provenance)
            echo "published: ${name}@${version}"
          done
