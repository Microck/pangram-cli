name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public GitHub Release version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the authorized npm package set
    runs-on: ubuntu-24.04
    environment: pangram-public-release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install exact development dependencies
        run: npm ci --ignore-scripts
      - name: Require the exact public release and authorization
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_AUTHORIZED: ${{ vars.PANGRAM_PUBLIC_RELEASE_AUTHORIZED }}
        run: |
          test "$RELEASE_AUTHORIZED" = true
          node -e '
            const manifest = require("./npm/pangram-cli/package.json");
            if (manifest.version !== process.env.VERSION) {
              throw new Error("package and authorized release versions do not match");
            }
          '
          release="$(gh release view "v${VERSION}" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r .tagName <<<"$release")" = "v${VERSION}"
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = false
      - name: Download and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir release-artifacts
          gh release download "v${VERSION}" --dir release-artifacts
          (cd release-artifacts && sha256sum --check SHA256SUMS)
      - name: Stage exact native binaries into platform packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/stage-npm-packages.mjs release-artifacts "$VERSION"
          npm run packages:check
          "npm/pangram-cli-linux-x64/bin/pangram" --version | grep -Fx "pangram ${VERSION}"
      - name: Validate the Tegami publish lock
        run: npm run tegami -- publish --dry-run
      - name: Publish missing platform packages, then the main package
        run: npm run tegami -- publish
