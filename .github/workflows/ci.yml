name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.97.1"
            manifest: rust-toolchain.toml
            table: toolchain
            key: channel
          - toolchain: "1.85.0"
            manifest: Cargo.toml
            table: package
            key: rust-version
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify toolchain manifest pin
        env:
          EXPECTED_TOOLCHAIN: ${{ matrix.toolchain }}
          MANIFEST_FILE: ${{ matrix.manifest }}
          MANIFEST_KEY: ${{ matrix.key }}
          MANIFEST_TABLE: ${{ matrix.table }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open(os.environ["MANIFEST_FILE"], "rb") as manifest_file:
              manifest = tomllib.load(manifest_file)

          actual = manifest[os.environ["MANIFEST_TABLE"]][os.environ["MANIFEST_KEY"]]
          expected = os.environ["EXPECTED_TOOLCHAIN"]

          def normalize(version):
              parts = tuple(int(part) for part in version.split("."))
              return parts + (0,) * max(0, 3 - len(parts))

          if normalize(actual) != normalize(expected):
              raise SystemExit(
                  f"{os.environ['MANIFEST_FILE']} pins {actual}, expected {expected}"
              )
          PY
      - name: Install Rust
        # dtolnay/rust-toolchain master, pinned 2026-07-28
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        if: matrix.toolchain == '1.97.1'
        run: cargo fmt --check
      - name: Run Clippy
        if: matrix.toolchain == '1.97.1'
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked --all-features
      - name: Prove one-package workspace
        if: matrix.toolchain == '1.97.1'
        run: |
          cargo metadata --locked --no-deps --format-version 1 |
            jq --exit-status '
              ((.packages | length) == 1) and
              ((.workspace_members | length) == 1) and
              (.packages[0].name == "microck-pangram-cli")
            ' >/dev/null
      - name: Check repository hygiene
        if: matrix.toolchain == '1.97.1'
        run: |
          rustfmt --edition 2024 --check tools/check-hygiene.rs
          rustc --edition=2024 -D warnings --test tools/check-hygiene.rs \
            -o "$RUNNER_TEMP/check-hygiene-tests"
          "$RUNNER_TEMP/check-hygiene-tests"
          rustc --edition=2024 -D warnings tools/check-hygiene.rs \
            -o "$RUNNER_TEMP/check-hygiene"
          "$RUNNER_TEMP/check-hygiene" .
      - name: Check generated-contract drift
        if: matrix.toolchain == '1.97.1'
        run: |
          cargo run --locked --features dev-tools --bin generate-contracts
          git diff --exit-code
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        # dtolnay/rust-toolchain master, pinned 2026-07-28
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Install pinned Rust security tools
        # taiki-e/install-action v2.85.2; verifies upstream checksums.
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Install pinned gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan Git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose
      - name: Audit Rust vulnerabilities
        run: cargo audit
      - name: Enforce dependency license policy
        run: |
          license_policy="$RUNNER_TEMP/cargo-deny.toml"
          printf '%s\n' \
            '[graph]' \
            'all-features = true' \
            '[licenses]' \
            'allow = [' \
            '  "MIT",' \
            '  "Apache-2.0",' \
            '  "Unicode-3.0",' \
            '  "Unlicense",' \
            '  "Zlib",' \
            ']' \
            '[licenses.private]' \
            'ignore = true' \
            >"$license_policy"
          cargo deny --config "$license_policy" check licenses
