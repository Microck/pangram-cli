name: Tegami version

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Open or update the version pull request
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install exact development dependencies
        run: npm ci --ignore-scripts
      - name: Validate package ownership before drafting
        run: npm run packages:check
      - name: Draft versions, changelogs, and publish lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run tegami -- version
